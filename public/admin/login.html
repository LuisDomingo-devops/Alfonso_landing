<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Alfonso AI Konta — Acceso
    </title>

    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #172033;
            --muted: #64748b;
            --primary: #172033;
            --primary-hover: #0f172a;
            --danger: #b91c1c;
            --danger-bg: #fee2e2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            display: grid;
            place-items: center;
            font-weight: 700;
        }

        .brand strong {
            display: block;
            font-size: 15px;
        }

        .brand span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: -0.02em;
        }

        .description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 8px 0 24px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font: inherit;
        }

        input:focus {
            border-color: #94a3b8;
            box-shadow:
                0 0 0 3px
                rgba(148, 163, 184, 0.15);
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 18px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 11px 12px;
            border-radius: 8px;
            background: var(--danger-bg);
            color: var(--danger);
            font-size: 13px;
        }

        .error.visible {
            display: block;
        }
    </style>
</head>

<body>

<main class="card">

    <div class="brand">
        <div class="brand-mark">
            A
        </div>

        <div>
            <strong>
                Alfonso AI Konta
            </strong>

            <span>
                Administración
            </span>
        </div>
    </div>

    <h1>
        Acceso administrativo
    </h1>

    <p class="description">
        Introduce la contraseña de administrador
        para acceder a la gestión de leads.
    </p>

    <form id="loginForm">

        <label for="password">
            Contraseña
        </label>

        <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button
            id="loginButton"
            type="submit"
        >
            Acceder
        </button>

        <div
            id="error"
            class="error"
        ></div>

    </form>

</main>

<script>
(function () {
    "use strict";

    const form =
        document.getElementById(
            "loginForm"
        );

    const password =
        document.getElementById(
            "password"
        );

    const button =
        document.getElementById(
            "loginButton"
        );

    const error =
        document.getElementById(
            "error"
        );

    async function checkExistingSession() {
        try {
            const response =
                await fetch(
                    "/api/admin/me",
                    {
                        credentials:
                            "same-origin"
                    }
                );

            if (
                response.ok
            ) {
                window.location.href =
                    "/admin/";
            }
        } catch {
            // No hay sesión.
        }
    }

    form.addEventListener(
        "submit",
        async function (event) {
            event.preventDefault();

            error.classList.remove(
                "visible"
            );

            button.disabled =
                true;

            try {
                const response =
                    await fetch(
                        "/api/admin/login",
                        {
                            method: "POST",
                            credentials:
                                "same-origin",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body:
                                JSON.stringify({
                                    password:
                                        password.value
                                })
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {
                    throw new Error(
                        data?.error?.message ||
                        "Credenciales incorrectas."
                    );
                }

                window.location.href =
                    "/admin/";
            } catch (loginError) {
                error.textContent =
                    loginError.message;

                error.classList.add(
                    "visible"
                );

                password.focus();
            } finally {
                button.disabled =
                    false;
            }
        }
    );

    checkExistingSession();
})();
</script>

</body>
</html>
