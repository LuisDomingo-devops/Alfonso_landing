<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alfonso AI Konta — Administración</title>

    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --border: #e2e8f0;
            --text: #172033;
            --muted: #64748b;
            --primary: #172033;
            --primary-hover: #0f172a;
            --danger: #b91c1c;
            --danger-soft: #fee2e2;
            --success: #166534;
            --success-soft: #dcfce7;
            --warning: #92400e;
            --warning-soft: #fef3c7;
            --info: #1d4ed8;
            --info-soft: #dbeafe;
            --radius: 12px;
            --shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .app {
            min-height: 100vh;
        }

        .topbar {
            height: 68px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 14px;
        }

        .brand-text strong {
            display: block;
            font-size: 15px;
        }

        .brand-text span {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-button,
        .refresh-button,
        .secondary-button {
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            border-radius: 8px;
            padding: 9px 14px;
            font-weight: 600;
        }

        .logout-button:hover,
        .refresh-button:hover,
        .secondary-button:hover {
            background: var(--surface-soft);
        }

        .main {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: -0.02em;
        }

        .page-header p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .page-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .primary-button {
            border: 0;
            border-radius: 8px;
            padding: 10px 15px;
            background: var(--primary);
            color: white;
            font-weight: 700;
        }

        .primary-button:hover {
            background: var(--primary-hover);
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(5, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 750;
            margin-top: 8px;
        }

        .workspace {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr)
                420px;
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }

        .filters {
            display: grid;
            grid-template-columns:
                1fr
                180px;
            gap: 10px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--text);
            padding: 10px 12px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #94a3b8;
            box-shadow:
                0 0 0 3px
                rgba(148, 163, 184, 0.15);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            background: var(--surface-soft);
            white-space: nowrap;
        }

        td {
            font-size: 13px;
        }

        tbody tr {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr.selected {
            background: #f1f5f9;
        }

        .lead-name {
            font-weight: 700;
        }

        .lead-company,
        .lead-email {
            color: var(--muted);
            margin-top: 3px;
            font-size: 12px;
        }

        .contact-date {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .status {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-new {
            color: var(--info);
            background: var(--info-soft);
        }

        .status-contacted {
            color: var(--warning);
            background: var(--warning-soft);
        }

        .status-qualified {
            color: #6d28d9;
            background: #ede9fe;
        }

        .status-converted {
            color: var(--success);
            background: var(--success-soft);
        }

        .status-discarded {
            color: var(--danger);
            background: var(--danger-soft);
        }

        .empty-state {
            padding: 45px 20px;
            text-align: center;
            color: var(--muted);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-top: 1px solid var(--border);
        }

        .pagination-info {
            color: var(--muted);
            font-size: 12px;
        }

        .pagination-buttons {
            display: flex;
            gap: 7px;
        }

        .pagination-buttons button {
            border: 1px solid var(--border);
            background: white;
            border-radius: 7px;
            padding: 7px 11px;
            font-size: 12px;
        }

        .pagination-buttons button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .detail-panel {
            position: sticky;
            top: 88px;
        }

        .detail-content {
            padding: 20px;
        }

        .detail-empty {
            min-height: 300px;
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--muted);
            padding: 30px;
        }

        .detail-empty p {
            margin-bottom: 0;
        }

        .detail-title {
            margin: 0;
            font-size: 21px;
        }

        .detail-subtitle {
            color: var(--muted);
            margin: 5px 0 20px;
            font-size: 13px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
        }

        .message-box {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        .meta-item {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }

        .meta-label {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
        }

        .meta-value {
            margin-top: 4px;
            font-size: 12px;
            word-break: break-word;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .actions .primary-button {
            flex: 1;
        }

        .danger-button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 700;
            background: var(--danger-soft);
            color: var(--danger);
        }

        .danger-button:hover {
            background: #fecaca;
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            max-width: 360px;
            background: #172033;
            color: white;
            padding: 13px 16px;
            border-radius: 9px;
            box-shadow: var(--shadow);
            font-size: 13px;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
            z-index: 100;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            background: var(--danger);
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: grid;
            place-items: center;
            padding: 20px;
            z-index: 80;
        }

        .modal {
            width: min(680px, 100%);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            box-shadow:
                0 24px 80px
                rgba(15, 23, 42, 0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--muted);
            font-size: 20px;
            line-height: 1;
        }

        .modal-close:hover {
            background: var(--surface-soft);
        }

        .modal-body {
            padding: 20px;
        }

        .modal-grid {
            display: grid;
            grid-template-columns:
                1fr
                1fr;
            gap: 16px;
        }

        .modal-grid .full {
            grid-column: 1 / -1;
        }

        .required {
            color: var(--danger);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 1100px) {
            .stats {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

            .workspace {
                grid-template-columns: 1fr;
            }

            .detail-panel {
                position: static;
            }
        }

        @media (max-width: 700px) {
            .topbar {
                padding: 0 16px;
            }

            .main {
                padding: 18px 14px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-actions {
                width: 100%;
            }

            .page-actions button {
                flex: 1;
            }

            .stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .meta,
            .modal-grid {
                grid-template-columns: 1fr;
            }

            .modal-grid .full {
                grid-column: auto;
            }

            .topbar-actions {
                gap: 4px;
            }

            .logout-button {
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                A
            </div>

            <div class="brand-text">
                <strong>
                    Alfonso AI Konta
                </strong>

                <span>
                    Administración de leads
                </span>
            </div>

        </div>

        <div class="topbar-actions">

            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >
                Cerrar sesión
            </button>

        </div>

    </header>

    <main class="main">

        <div class="page-header">

            <div>

                <h1>
                    Leads
                </h1>

                <p>
                    Gestiona las solicitudes de participación
                    en la beta de Alfonso.
                </p>

            </div>

            <div class="page-actions">

                <button
                    id="refreshButton"
                    class="refresh-button"
                    type="button"
                >
                    Actualizar
                </button>

                <button
                    id="newLeadButton"
                    class="primary-button"
                    type="button"
                >
                    + Nuevo lead
                </button>

            </div>

        </div>

        <section class="stats">

            <div class="stat-card">
                <div class="stat-label">
                    Total
                </div>

                <div
                    id="statTotal"
                    class="stat-value"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Nuevos
                </div>

                <div
                    id="statNew"
                    class="stat-value"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Contactados
                </div>

                <div
                    id="statContacted"
                    class="stat-value"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Cualificados
                </div>

                <div
                    id="statQualified"
                    class="stat-value"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Convertidos
                </div>

                <div
                    id="statConverted"
                    class="stat-value"
                >
                    0
                </div>
            </div>

        </section>

        <section class="workspace">

            <div class="panel">

                <div class="panel-header">

                    <div class="filters">

                        <input
                            id="searchInput"
                            type="search"
                            placeholder="Buscar por nombre, email o empresa..."
                            autocomplete="off"
                        >

                        <select id="statusFilter">

                            <option value="">
                                Todos los estados
                            </option>

                            <option value="new">
                                Nuevos
                            </option>

                            <option value="contacted">
                                Contactados
                            </option>

                            <option value="qualified">
                                Cualificados
                            </option>

                            <option value="converted">
                                Convertidos
                            </option>

                            <option value="discarded">
                                Descartados
                            </option>

                        </select>

                    </div>

                </div>

                <div
                    id="tableContainer"
                    class="table-wrapper"
                ></div>

                <div class="pagination">

                    <div
                        id="paginationInfo"
                        class="pagination-info"
                    >
                        —
                    </div>

                    <div class="pagination-buttons">

                        <button
                            id="previousButton"
                            type="button"
                        >
                            Anterior
                        </button>

                        <button
                            id="nextButton"
                            type="button"
                        >
                            Siguiente
                        </button>

                    </div>

                </div>

            </div>

            <aside class="panel detail-panel">

                <div
                    id="detailEmpty"
                    class="detail-empty"
                >

                    <div>

                        <strong>
                            Selecciona un lead
                        </strong>

                        <p>
                            Aquí aparecerán los datos
                            y las opciones de gestión.
                        </p>

                    </div>

                </div>

                <div
                    id="detailContent"
                    class="detail-content hidden"
                >

                    <h2
                        id="detailName"
                        class="detail-title"
                    ></h2>

                    <p
                        id="detailCompany"
                        class="detail-subtitle"
                    ></p>

                    <div class="meta">

                        <div class="meta-item">

                            <div class="meta-label">
                                Email
                            </div>

                            <div
                                id="detailEmail"
                                class="meta-value"
                            ></div>

                        </div>

                        <div class="meta-item">

                            <div class="meta-label">
                                Alta
                            </div>

                            <div
                                id="detailCreated"
                                class="meta-value"
                            ></div>

                        </div>

                    </div>

                    <div class="field">

                        <label for="detailStatus">
                            Estado
                        </label>

                        <select id="detailStatus">

                            <option value="new">
                                Nuevo
                            </option>

                            <option value="contacted">
                                Contactado
                            </option>

                            <option value="qualified">
                                Cualificado
                            </option>

                            <option value="converted">
                                Convertido
                            </option>

                            <option value="discarded">
                                Descartado
                            </option>

                        </select>

                    </div>

                    <div class="field">

                        <label>
                            Mensaje
                        </label>

                        <div
                            id="detailMessage"
                            class="message-box"
                        ></div>

                    </div>

                    <div class="field">

                        <label for="detailNotes">
                            Notas internas
                        </label>

                        <textarea
                            id="detailNotes"
                            maxlength="5000"
                            placeholder="Añade notas sobre este lead..."
                        ></textarea>

                    </div>

                    <div class="field">

                        <label for="detailContactedAt">
                            Fecha de contacto
                        </label>

                        <input
                            id="detailContactedAt"
                            type="datetime-local"
                        >

                    </div>

                    <div class="actions">

                        <button
                            id="saveButton"
                            class="primary-button"
                            type="button"
                        >
                            Guardar cambios
                        </button>

                        <button
                            id="deleteButton"
                            class="danger-button"
                            type="button"
                        >
                            Eliminar
                        </button>

                    </div>

                </div>

            </aside>

        </section>

    </main>

</div>

<div
    id="newLeadModal"
    class="modal-backdrop hidden"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="newLeadTitle"
    >

        <div class="modal-header">

            <h2 id="newLeadTitle">
                Nuevo lead
            </h2>

            <button
                id="closeNewLeadButton"
                class="modal-close"
                type="button"
                aria-label="Cerrar"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <form id="newLeadForm">

                <div class="modal-grid">

                    <div class="field">

                        <label for="newLeadName">
                            Nombre
                            <span class="required">
                                *
                            </span>
                        </label>

                        <input
                            id="newLeadName"
                            type="text"
                            maxlength="200"
                            required
                            autocomplete="name"
                        >

                    </div>

                    <div class="field">

                        <label for="newLeadEmail">
                            Email
                            <span class="required">
                                *
                            </span>
                        </label>

                        <input
                            id="newLeadEmail"
                            type="email"
                            maxlength="320"
                            required
                            autocomplete="email"
                        >

                    </div>

                    <div class="field">

                        <label for="newLeadCompany">
                            Empresa
                        </label>

                        <input
                            id="newLeadCompany"
                            type="text"
                            maxlength="200"
                            autocomplete="organization"
                        >

                    </div>

                    <div class="field">

                        <label for="newLeadStatus">
                            Estado
                        </label>

                        <select id="newLeadStatus">

                            <option value="new">
                                Nuevo
                            </option>

                            <option value="contacted">
                                Contactado
                            </option>

                            <option value="qualified">
                                Cualificado
                            </option>

                            <option value="converted">
                                Convertido
                            </option>

                            <option value="discarded">
                                Descartado
                            </option>

                        </select>

                    </div>

                    <div class="field full">

                        <label for="newLeadMessage">
                            Mensaje
                        </label>

                        <textarea
                            id="newLeadMessage"
                            maxlength="5000"
                            placeholder="Mensaje o información inicial del lead..."
                        ></textarea>

                    </div>

                    <div class="field full">

                        <label for="newLeadNotes">
                            Notas internas
                        </label>

                        <textarea
                            id="newLeadNotes"
                            maxlength="5000"
                            placeholder="Notas internas..."
                        ></textarea>

                    </div>

                    <div class="field full">

                        <label for="newLeadContactedAt">
                            Fecha de contacto
                        </label>

                        <input
                            id="newLeadContactedAt"
                            type="datetime-local"
                        >

                    </div>

                </div>

                <div class="modal-actions">

                    <button
                        id="cancelNewLeadButton"
                        class="secondary-button"
                        type="button"
                    >
                        Cancelar
                    </button>

                    <button
                        id="createLeadButton"
                        class="primary-button"
                        type="submit"
                    >
                        Crear lead
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<div
    id="toast"
    class="toast"
></div>

<script>
(function () {
    "use strict";

    const state = {
        leads: [],
        selectedLead: null,
        page: 1,
        limit: 25,
        total: 0,
        totalPages: 0,
        search: "",
        status: ""
    };

    const elements = {
        tableContainer:
            document.getElementById(
                "tableContainer"
            ),

        paginationInfo:
            document.getElementById(

    let searchTimeout = null;

    function escapeHtml(value) {
        return String(
            value ?? ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }

    function formatDate(value) {
        if (!value) {
            return "—";
        }

        const date =
            new Date(value);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return value;
        }

        return new Intl.DateTimeFormat(
            "es-ES",
            {
                dateStyle: "short",
                timeStyle: "short"
            }
        ).format(date);
    }

    function formatDateTimeLocal(
        value
    ) {
        if (!value) {
            return "";
        }

        const date =
            new Date(value);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return "";
        }

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        const hours =
            String(
                date.getHours()
            ).padStart(2, "0");

        const minutes =
            String(
                date.getMinutes()
            ).padStart(2, "0");

        return (
            `${year}-${month}-${day}` +
            `T${hours}:${minutes}`
        );
    }

    function showToast(
        message,
        isError = false
    ) {
        elements.toast.textContent =
            message;

        elements.toast.classList.toggle(
            "error",
            isError
        );

        elements.toast.classList.add(
            "visible"
        );

        window.setTimeout(
            function () {
                elements.toast.classList.remove(
                    "visible"
                );
            },
            3000
        );
    }

    async function api(
        url,
        options = {}
    ) {
        const response =
            await fetch(
                url,
                {
                    credentials:
                        "same-origin",
                    ...options
                }
            );

        let data = null;

        try {
            data =
                await response.json();
        } catch {
            data = null;
        }

        if (
            response.status === 401
        ) {
            window.location.href =
                "/admin/login.html";

            throw new Error(
                "Authentication required."
            );
        }

        if (
            !response.ok ||
            !data?.success
        ) {
            throw new Error(
                data?.error?.message ||
                "La operación no se pudo completar."
            );
        }

        return data.data;
    }

    async function verifySession() {
        try {
            await api(
                "/api/admin/me"
            );
        } catch (error) {
            if (
                error.message !==
                "Authentication required."
            ) {
                window.location.href =
                    "/admin/login.html";
            }

            return false;
        }

        return true;
    }

    async function loadLeads() {
        elements.tableContainer.classList.add(
            "loading"
        );

        const params =
            new URLSearchParams();

        params.set(
            "page",
            String(state.page)
        );

        params.set(
            "limit",
            String(state.limit)
        );

        if (state.search) {
            params.set(
                "search",
                state.search
            );
        }

        if (state.status) {
            params.set(
                "status",
                state.status
            );
        }

        try {
            const data =
                await api(
                    `/api/admin/leads?${params.toString()}`
                );

            state.leads =
                data.leads || [];

            state.total =
                Number(
                    data.pagination?.total ||
                    0
                );

            state.totalPages =
                Number(
                    data.pagination?.totalPages ||
                    0
                );

            renderTable();
            renderPagination();

            await loadStats();

            if (
                state.selectedLead
            ) {
                const updated =
                    state.leads.find(
                        lead =>
                            lead.id ===
                            state.selectedLead.id
                    );

                if (updated) {
                    selectLead(
                        updated
                    );
                }
            }
        } catch (error) {
            showToast(
                error.message,
                true
            );
        } finally {
            elements.tableContainer.classList.remove(
                "loading"
            );
        }
    }

    async function loadStats() {
        try {
            const statuses = [
                "",
                "new",
                "contacted",
                "qualified",
                "converted"
            ];

            const results =
                await Promise.all(
                    statuses.map(
                        async status => {
                            const params =
                                new URLSearchParams();

                            params.set(
                                "page",
                                "1"
                            );

                            params.set(
                                "limit",
                                "1"
                            );

                            if (status) {
                                params.set(
                                    "status",
                                    status
                                );
                            }

                            const data =
                                await api(
                                    `/api/admin/leads?${params.toString()}`
                                );

                            return Number(
                                data.pagination?.total ||
                                0
                            );
                        }
                    )
                );

            elements.statTotal.textContent =
                results[0];

            elements.statNew.textContent =
                results[1];

            elements.statContacted.textContent =
                results[2];

            elements.statQualified.textContent =
                results[3];

            elements.statConverted.textContent =
                results[4];
        } catch {
            // El listado principal sigue funcionando.
        }
    }

    function statusLabel(
        status
    ) {
        const labels = {
            new: "Nuevo",
            contacted: "Contactado",
            qualified: "Cualificado",
            converted: "Convertido",
            discarded: "Descartado"
        };

        return (
            labels[status] ||
            status ||
            "Nuevo"
        );
    }

    function statusClass(
        status
    ) {
        return (
            "status-" +
            (
                status ||
                "new"
            )
        );
    }

    function renderTable() {
        if (
            state.leads.length === 0
        ) {
            elements.tableContainer.innerHTML =
                `
                <div class="empty-state">
                    No hay leads que coincidan con los filtros.
                </div>
                `;

            return;
        }

        const rows =
            state.leads
                .map(
                    lead => {
                        const selected =
                            state.selectedLead &&
                            state.selectedLead.id ===
                                lead.id
                                ? "selected"
                                : "";

                        return `
                            <tr
                                class="${selected}"
                                data-id="${lead.id}"
                            >

                                <td>
                                    <div class="lead-name">
                                        ${escapeHtml(
                                            lead.name
                                        )}
                                    </div>

                                    <div class="lead-email">
                                        ${escapeHtml(
                                            lead.email
                                        )}
                                    </div>
                                </td>

                                <td>
                                    <div>
                                        ${escapeHtml(
                                            lead.company ||
                                            "—"
                                        )}
                                    </div>
                                </td>

                                <td>
                                    <span
                                        class="status ${statusClass(
                                            lead.status
                                        )}"
                                    >
                                        ${escapeHtml(
                                            statusLabel(
                                                lead.status
                                            )
                                        )}
                                    </span>
                                </td>

                                <td>
                                    ${escapeHtml(
                                        formatDate(
                                            lead.created_at
                                        )
                                    )}
                                </td>

                                <td>
                                    <span class="contact-date">
                                        ${escapeHtml(
                                            formatDate(
                                                lead.contacted_at
                                            )
                                        )}
                                    </span>
                                </td>

                            </tr>
                        `;
                    }
                )
                .join("");

        elements.tableContainer.innerHTML =
            `
            <table>

                <thead>

                    <tr>

                        <th>
                            Lead
                        </th>

                        <th>
                            Empresa
                        </th>

                        <th>
                            Estado
                        </th>

                        <th>
                            Alta
                        </th>

                        <th>
                            Contacto
                        </th>

                    </tr>

                </thead>

                <tbody>
                    ${rows}
                </tbody>

            </table>
            `;

        elements.tableContainer
            .querySelectorAll(
                "tbody tr"
            )
            .forEach(
                row => {
                    row.addEventListener(
                        "click",
                        function () {
                            const id =
                                Number(
                                    row.dataset.id
                                );

                            const lead =
                                state.leads.find(
                                    item =>
                                        item.id ===
                                        id
                                );

                            if (lead) {
                                selectLead(
                                    lead
                                );
                            }
                        }
                    );
                }
            );
    }

    function renderPagination() {
        if (
            state.total === 0
        ) {
            elements.paginationInfo.textContent =
                "Sin resultados";
        } else {
            const start =
                (state.page - 1) *
                    state.limit +
                1;

            const end =
                Math.min(
                    state.page *
                        state.limit,
                    state.total
                );

            elements.paginationInfo.textContent =
                `${start}–${end} de ${state.total}`;
        }

        elements.previousButton.disabled =
            state.page <= 1;

        elements.nextButton.disabled =
            state.page >=
            state.totalPages;
    }

    function selectLead(
        lead
    ) {
        state.selectedLead =
            lead;

        elements.detailEmpty.classList.add(
            "hidden"
        );

        elements.detailContent.classList.remove(
            "hidden"
        );

        elements.detailName.textContent =
            lead.name ||
            "Sin nombre";

        elements.detailCompany.textContent =
            lead.company ||
            "Empresa no indicada";

        elements.detailEmail.textContent =
            lead.email ||
            "—";

        elements.detailCreated.textContent =
            formatDate(
                lead.created_at
            );

        elements.detailStatus.value =
            lead.status ||
            "new";

        elements.detailMessage.textContent =
            lead.message ||
            "Sin mensaje.";

        elements.detailNotes.value =
            lead.notes ||
            "";

        elements.detailContactedAt.value =
            formatDateTimeLocal(
                lead.contacted_at
            );

        renderTable();
    }

    async function saveLead() {
        if (
            !state.selectedLead
        ) {
            return;
        }

        const status =
            elements.detailStatus.value;

        const notes =
            elements.detailNotes.value;

        const contactedValue =
            elements.detailContactedAt.value;

        let contacted_at =
            null;

        if (
            contactedValue
        ) {
            const date =
                new Date(
                    contactedValue
                );

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                showToast(
                    "La fecha de contacto no es válida.",
                    true
                );

                return;
            }

            contacted_at =
                date.toISOString();
        }

        elements.saveButton.disabled =
            true;

        try {
            const lead =
                await api(
                    `/api/admin/leads/${state.selectedLead.id}`,
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                status,
                                notes,
                                contacted_at
                            })
                    }
                );

            state.selectedLead =
                lead;

            const index =
                state.leads.findIndex(
                    item =>
                        item.id ===
                        lead.id
                );

            if (
                index !== -1
            ) {
                state.leads[index] =
                    lead;
            }

            selectLead(
                lead
            );

            renderTable();

            await loadStats();

            showToast(
                "Lead actualizado correctamente."
            );
        } catch (error) {
            showToast(
                error.message,
                true
            );
        } finally {
            elements.saveButton.disabled =
                false;
        }
    }

    function openNewLeadModal() {
        elements.newLeadForm.reset();

        elements.newLeadStatus.value =
            "new";

        elements.newLeadModal.classList.remove(
            "hidden"
        );

        window.setTimeout(
            function () {
                elements.newLeadName.focus();
            },
            50
        );
    }

    function closeNewLeadModal() {
        elements.newLeadModal.classList.add(
            "hidden"
        );

        elements.newLeadForm.reset();

        elements.newLeadStatus.value =
            "new";
    }

    async function createLead(
        event
    ) {
        event.preventDefault();

        const name =
            elements.newLeadName.value.trim();

        const email =
            elements.newLeadEmail.value.trim();

        const company =
            elements.newLeadCompany.value.trim();

        const message =
            elements.newLeadMessage.value.trim();

        const status =
            elements.newLeadStatus.value;

        const notes =
            elements.newLeadNotes.value.trim();

        const contactedValue =
            elements.newLeadContactedAt.value;

        if (!name) {
            showToast(
                "El nombre es obligatorio.",
                true
            );

            elements.newLeadName.focus();

            return;
        }

        if (!email) {
            showToast(
                "El email es obligatorio.",
                true
            );

            elements.newLeadEmail.focus();

            return;
        }

        let contacted_at =
            null;

        if (
            contactedValue
        ) {
            const date =
                new Date(
                    contactedValue
                );

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                showToast(
                    "La fecha de contacto no es válida.",
                    true
                );

                return;
            }

            contacted_at =
                date.toISOString();
        }

        elements.createLeadButton.disabled =
            true;

        try {
            const lead =
                await api(
                    "/api/admin/leads",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name,
                                email,
                                company:
                                    company ||
                                    null,
                                message:
                                    message ||
                                    null,
                                source:
                                    "admin",
                                status,
                                notes:
                                    notes ||
                                    null,
                                contacted_at
                            })
                    }
                );

            closeNewLeadModal();

            state.search = "";
            state.status = "";
            state.page = 1;

            elements.searchInput.value =
                "";

            elements.statusFilter.value =
                "";

            await loadLeads();

            const createdLead =
                state.leads.find(
                    item =>
                        item.id ===
                        lead.id
                );

            if (
                createdLead
            ) {
                selectLead(
                    createdLead
                );
            } else {
                selectLead(
                    lead
                );
            }

            showToast(
                "Lead creado correctamente."
            );
        } catch (error) {
            showToast(
                error.message,
                true
            );
        } finally {
            elements.createLeadButton.disabled =
                false;
        }
    }

    async function deleteSelectedLead() {
        if (
            !state.selectedLead
        ) {
            return;
        }

        const confirmed =
            window.confirm(
                `¿Eliminar el lead de ${state.selectedLead.name}? Esta acción no se puede deshacer.`
            );

        if (!confirmed) {
            return;
        }

        elements.deleteButton.disabled =
            true;

        try {
            await api(
                `/api/admin/leads/${state.selectedLead.id}`,
                {
                    method: "DELETE"
                }
            );

            state.selectedLead =
                null;

            elements.detailContent.classList.add(
                "hidden"
            );

            elements.detailEmpty.classList.remove(
                "hidden"
            );

            if (
                state.leads.length ===
                    1 &&
                state.page > 1
            ) {
                state.page--;
            }

            await loadLeads();

            showToast(
                "Lead eliminado correctamente."
            );
        } catch (error) {
            showToast(
                error.message,
                true
            );
        } finally {
            elements.deleteButton.disabled =
                false;
        }
    }

    async function logout() {
        try {
            await api(
                "/api/admin/logout",
                {
                    method: "POST"
                }
            );
        } catch {
            // Redirigimos igualmente.
        }

        window.location.href =
            "/admin/login.html";
    }

    elements.searchInput.addEventListener(
        "input",
        function () {
            window.clearTimeout(
                searchTimeout
            );

            searchTimeout =
                window.setTimeout(
                    function () {
                        state.search =
                            elements.searchInput.value.trim();

                        state.page = 1;

                        loadLeads();
                    },
                    300
                );
        }
    );

    elements.statusFilter.addEventListener(
        "change",
        function () {
            state.status =
                elements.statusFilter.value;

            state.page = 1;

            loadLeads();
        }
    );

    elements.refreshButton.addEventListener(
        "click",
        function () {
            loadLeads();
        }
    );

    elements.newLeadButton.addEventListener(
        "click",
        openNewLeadModal
    );

    elements.closeNewLeadButton.addEventListener(
        "click",
        closeNewLeadModal
    );

    elements.cancelNewLeadButton.addEventListener(
        "click",
        closeNewLeadModal
    );

    elements.newLeadForm.addEventListener(
        "submit",
        createLead
    );

    elements.newLeadModal.addEventListener(
        "click",
        function (event) {
            if (
                event.target ===
                elements.newLeadModal
            ) {
                closeNewLeadModal();
            }
        }
    );

    document.addEventListener(
        "keydown",
        function (event) {
            if (
                event.key === "Escape" &&
                !elements.newLeadModal.classList.contains(
                    "hidden"
                )
            ) {
                closeNewLeadModal();
            }
        }
    );

    elements.previousButton.addEventListener(
        "click",
        function () {
            if (
                state.page > 1
            ) {
                state.page--;

                loadLeads();
            }
        }
    );

    elements.nextButton.addEventListener(
        "click",
        function () {
            if (
                state.page <
                state.totalPages
            ) {
                state.page++;

                loadLeads();
            }
        }
    );

    elements.saveButton.addEventListener(
        "click",
        saveLead
    );

    elements.deleteButton.addEventListener(
        "click",
        deleteSelectedLead
    );

    elements.logoutButton.addEventListener(
        "click",
        logout
    );

    async function init() {
        const authenticated =
            await verifySession();

        if (
            !authenticated
        ) {
            return;
        }

        await loadLeads();
    }

    init();
})();
</script>
